<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asha Isse</title>
<meta name="description" content="Asha Isse: operations and client experience leader. Los Angeles, CA.">
<link href="https://googleapis.com" rel="stylesheet">
<style>
  :root {
    --cream: #fffdf1;
    --blue: #2b5b8a;
    --blue-deep: #1f4468;
    --sky: #a9c8e8;
    --ink: #2a2a2a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Nunito Sans', sans-serif; font-weight: 300; font-size: 1.08rem;
    color: var(--ink); background: var(--cream); line-height: 1.75; overflow-x: hidden;
  }
  body.locked { overflow: hidden; height: 100vh; }
  a { color: inherit; }
  button { font-family: inherit; }
  h1, h2, h3, .rubik { font-family: 'Rubik', sans-serif; }

  /* ---------- OCEAN SPLIT INTRO SCREEN ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 100; pointer-events: none;
    display: flex; flex-direction: row; width: 100vw; height: 100vh;
  }
  
  /* The two halves of the splitting ocean curtain */
  .ocean-gate {
    width: 50vw; height: 100vh; pointer-events: auto;
    background-image: url('https://fineartamerica.com');
    background-size: 200% 100%; background-repeat: no-repeat;
    box-shadow: inset 0 0 100px rgba(8, 28, 52, 0.4);
    transition: transform 1.6s cubic-bezier(.77, 0, .18, 1);
    position: relative; display: flex; flex-direction: column; justify-content: center;
  }
  .ocean-left {
    background-position: left center; border-right: 1px solid rgba(255,255,255,0.15);
    align-items: flex-end; padding-right: 2vw;
  }
  .ocean-right {
    background-position: right center; border-left: 1px solid rgba(255,255,255,0.15);
    align-items: flex-start; padding-left: 2vw;
  }

  /* When the gate triggers open */
  #intro.gone .ocean-left { transform: translateX(-100%); }
  #intro.gone .ocean-right { transform: translateX(100%); }

  /* Centered Typography Context Layer */
  .intro-overlay {
    position: absolute; inset: 0; z-index: 105; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4vh; text-align: center; color: var(--cream); padding: 0 6vw;
    transition: opacity 0.8s ease;
  }
  #intro.gone .intro-overlay { opacity: 0; }

  /* Animated typography layouts */
  .asha { display: flex; gap: 0.1em; font-family: 'Rubik', sans-serif; font-weight: 600; font-size: clamp(4rem, 15vw, 9rem); line-height: 1; text-shadow: 0 4px 20px rgba(0,0,0,0.3); }
  .asha span { display: inline-block; opacity: 0; transform: translateY(40px); animation: rise 0.9s cubic-bezier(.2, .8, .2, 1) forwards; }
  .asha span:nth-child(1) { animation-delay: 0.15s; }
  .asha span:nth-child(2) { animation-delay: 0.35s; }
  .asha span:nth-child(3) { animation-delay: 0.55s; }
  .asha span:nth-child(4) { animation-delay: 0.75s; }
  
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes fadein { to { opacity: 1; } }

  /* Serene interactive call to action button */
  .ocean-trigger {
    background: transparent; border: 2px solid var(--cream); color: var(--cream);
    font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 0.85rem; letter-spacing: 0.25em; text-transform: uppercase;
    padding: 16px 40px; border-radius: 999px; cursor: pointer; pointer-events: auto;
    opacity: 0; animation: fadein 1s 1.4s forwards;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2); backdrop-filter: blur(4px);
    transition: background 0.3s, color 0.3s, transform 0.3s;
  }
  .ocean-trigger:hover { background: var(--cream); color: var(--blue-deep); transform: scale(1.03); }

  .hint { font-family: 'Rubik', sans-serif; font-size: 0.78rem; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0; animation: fadein 0.9s 1.8s forwards; color: var(--sky); text-shadow: 0 2px 8px rgba(0,0,0,0.2); }

  /* ---------- NAV ---------- */
  header.top {
    position: sticky; top: 0; z-index: 50; background: rgba(255, 253, 241, 0.94); backdrop-filter: blur(6px);
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 20px 5vw; border-bottom: 1px solid rgba(43, 91, 138, 0.18);
  }
  .logo { font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 1.25rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--blue); text-decoration: none; }
  nav.links a {
    font-family: 'Rubik', sans-serif; font-weight: 400; font-size: 0.82rem; letter-spacing: 0.14em; text-transform: uppercase;
    text-decoration: none; margin-left: clamp(14px, 3vw, 34px); padding-bottom: 4px; border-bottom: 2px solid transparent; transition: border-color 0.3s, color 0.3s;
  }
  nav.links a:hover, nav.links a.active { color: var(--blue); border-color: var(--blue); }

  /* ---------- PAGES ---------- */
  .page[hidden] { display: none; }
  .page.show { animation: pagein 0.6s ease; }
  @keyframes pagein { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 6vw; }
  .sec { padding: 9vh 0; }
  h2.sec-title { font-weight: 600; text-transform: uppercase; font-size: clamp(2rem, 6vw, 3.6rem); line-height: 1.05; letter-spacing: -0.01em; margin-bottom: 20px; }
  .sub { color: var(--blue); font-family: 'Rubik', sans-serif; font-weight: 500; text-transform: uppercase; font-size: 1.2rem; margin-bottom: 18px; }
  .intro-text { max-width: 640px; font-size: 1.2rem; margin-bottom: 36px; }

  .wave { display: block; width: 100%; height: clamp(50px, 8vw, 110px); }
  .wave path { fill: currentColor; }
  .wave.to-blue { color: var(--blue); background: var(--cream); }
  .wave.to-cream { color: var(--cream); background: var(--blue); }

  .panel { background: var(--blue); color: #fff; padding: 2vh 0 4vh; }
  .panel .sec-title { color: #fff; }
  .row { display: grid; grid-template-columns: minmax(120px, 240px) 1fr; gap: clamp(1rem, 5vw, 4rem); padding: 2.2rem 0; }
  .row + .row { border-top: 1px solid rgba(255, 255, 255, 0.75); }
  .row h3 { font-weight: 500; font-size: 1.6rem; line-height: 1.2; }
  .row p { font-size: 1.12rem; font-weight: 300; }

  /* ---------- HERO & BACKDROP INTEGRATION ---------- */
  .hero { 
    position: relative; padding: 14vh 0 12vh; overflow: hidden;
  }
  
  /* Serene structural background wrapper behind hero layout text fields */
  .hero-backdrop {
    position: absolute; inset: 0; z-index: -1; opacity: 0.12; pointer-events: none;
    background-image: url('https://fineartamerica.com');
    background-size: cover; background-position: center bottom;
    filter: saturate(0.6) blue;
  }

  .hero .eyebrow { font-family: 'Rubik', sans-serif; font-size: 0.8rem; letter-spacing: 0.26em; text-transform: uppercase; color: var(--blue); margin-bottom: 20px; }
  .hero h1 { font-weight: 600; text-transform: uppercase; font-size: clamp(3.2rem, 12vw, 9.5rem); line-height: 0.95; letter-spacing: -0.03em; margin-bottom: 30px; }
  .hero p.lead { max-width: 680px; font-size: 1.35rem; margin-bottom: 38px; line-height: 1.8; font-weight: 300; }
  
  .circled { position: relative; display: inline-block; font-weight: 600; color: var(--blue); padding: 0 4px; }
  .circled svg { position: absolute; left: -12px; right: -12px; top: -10px; bottom: -10px; width: calc(100% + 24px); height: calc(100% + 20px); pointer-events: none; }
  .circled svg path { fill: none; stroke: var(--blue); stroke-width: 2; stroke-linecap: round; }
  
  .btns { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn {
    display: inline-block; font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase;
    background: var(--blue); color: #fff; border: 2px solid var(--blue); padding: 15px 36px; border-radius: 999px; text-decoration: none; cursor: pointer;
    transition: transform 0.25s, background 0.25s, color 0.25s;
  }
  .btn:hover { transform: translateY(-3px); background: var(--blue-deep); border-color: var(--blue-deep); }
  .btn.ghost { background: transparent; color: var(--blue); }
  .btn.ghost:hover { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* ---------- STATS SECTION (REPAIRED & CLEANED) ---------- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0; border-top: 1px solid rgba(43, 91, 138, 0.35); margin-top: 6vh; }
  .stat { padding: 34px 24px 34px 0; border-bottom: 1px solid rgba(43, 91, 138, 0.35); }
  .stat .n { font-family: 'Rubik', sans-serif; font-weight: 600; font-size: clamp(3.4rem, 9vw, 5.4rem); line-height: 1; color: var(--blue); }
  .stat p { margin-top: 10px; max-width: 240px; font-weight: 400; font-size: 0.95rem; color: var(--ink); opacity: 0.85; }
</style>
</head>
<body class="locked">

  <!-- OCEAN SPLIT CONTAINER SCREEN -->
  <div id="intro">
    <div class="ocean-gate ocean-left"></div>
    <div class="ocean-gate ocean-right"></div>
    
    <div class="intro-overlay">
      <div class="asha">
        <span>A</span><span>S</span><span>H</span><span>A</span>
      </div>
      <button class="ocean-trigger" onclick="openWebsite()">Let Me Take Over Serene Energy</button>
      <div class="hint">Building on the wave of tranquility</div>
    </div>
  </div>

  <!-- STICKY TOP NAVIGATION -->
  <header class="top">
    <a href="#" class="logo">Asha Isse</a>
    <nav class="links">
      <a href="#home" class="active">Home</a>
      <a href="#about">About</a>
      <a href="#work">Work</a>
    </nav>
  </header>

  <!-- HOME PAGE CONTAINER -->
  <main class="page show" id="home">
